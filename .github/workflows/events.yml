name: Event collector
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated school ids to check"
        required: false
      debug:
        description: "Optional: print what each page contains (1)"
        required: false
permissions:
  contents: write
concurrency:
  group: event-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Collect dated events from official pages
        run: node .github/scripts/events.mjs
        env:
          EVENTS_ONLY: ${{ inputs.only }}
          EVENTS_DEBUG: ${{ inputs.debug }}
      - name: Publish
        run: |
          if [ -n "$(git status --porcelain data/events.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json
            git commit -m "Update event dates from official pages"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes"
          fi
